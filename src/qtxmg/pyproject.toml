[project]
name = "qtxmg"
version = "0.2.0"
description = "Single- and multi-GPU QTBM transport solver: density-matrix mode-space hierarchy as the coarse levels of a V-cycle in flexible GMRES, Beyn lead OBC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
prep = ["h5py>=3.9"]                 # prep.quatrex: QuaTrEx hamiltonian.h5 / overlap.h5
gpu = ["cupy-cuda12x>=13"]           # --gpu, CUDA 12 driver
gpu13 = ["cupy-cuda13x>=14"]         # --gpu, CUDA 13 driver (daint GH200)
mpi = ["mpi4py>=3.1"]                # qtxmg-multi --dist mpi | nccl
nccl13 = ["nvidia-nccl-cu13"]        # --dist nccl (or $QTX_NCCL = path of libnccl.so.2)

[project.scripts]
qtxmg = "qtxmg.single:main"
qtxmg-multi = "qtxmg.hier.run:main"
qtxmg-prep-quatrex = "qtxmg.prep.quatrex:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qtxmg"]

[tool.hatch.build.targets.sdist]
include = ["src/qtxmg", "scripts/daint", "tests", "README.md", "pyproject.toml"]
